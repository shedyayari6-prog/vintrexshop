
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VintrexShop - Open Your Online Store, Cash on Delivery</title>

    <meta
      name="description"
      content="Create your own online store in minutes with VintrexShop. Add products, choose your colors, share one link and get paid in cash on delivery."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VintrexShop" />
    <meta
      property="og:title"
      content="VintrexShop - Open Your Online Store, Cash on Delivery"
    />
    <meta
      property="og:description"
      content="Create your own online store in minutes with VintrexShop. Add products, choose your colors, share one link and get paid in cash on delivery."
    />
    <meta property="og:url" content="https://www.vintrexshop.store/" />
    <meta
      property="og:image"
      content="https://www.vintrexshop.store/og-image.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VintrexShop - Open Your Online Store, Cash on Delivery"
    />
    <meta
      name="twitter:description"
      content="Create your own online store in minutes with VintrexShop. Add products, choose your colors, share one link and get paid in cash on delivery."
    />
    <meta
      name="twitter:image"
      content="https://www.vintrexshop.store/og-image.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.vintrexshop.store/#org",
            "name": "VintrexShop",
            "url": "https://www.vintrexshop.store/",
            "logo": "https://www.vintrexshop.store/logo.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.vintrexshop.store/#website",
            "url": "https://www.vintrexshop.store/",
            "name": "VintrexShop",
            "publisher": {
              "@id": "https://www.vintrexshop.store/#org"
            }
          }
        ]
      }
    </script>

    <!-- Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Google AdSense -->
    <!-- Keep this only if you still use Google AdSense. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9821815388165091"
      crossorigin="anonymous"
    ></script>

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-E3RW8ERNVG"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-E3RW8ERNVG");
    </script>

    <!--

    -->
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
